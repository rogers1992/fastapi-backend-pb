services:
  postgres-test:
    image: postgres:14-alpine
    container_name: paraiso_biker_db_test
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_TESTS:-paraiso_biker_test}
    ports:
      - "5433:5432"                                  # <-- different host port
    volumes:
      - postgres_test_data:/var/lib/postgresql/data  # <-- separate volume
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db/migrations:/migrations                 # <-- also mount migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data: